[package]
name = "notch"
version = "0.1.0"
edition = "2024"

[dependencies]
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Graphics_Direct2D", "Win32_Graphics_Direct2D_Common", "Win32_Graphics_Dxgi_Common", "Win32_System_LibraryLoader", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_HiDpi", "Win32_System_Threading", "Win32_Graphics_DirectWrite", "Media_Control", "Foundation", "Storage_Streams", "Foundation_Numerics", "Win32_System_Com", "Win32_Graphics_Imaging", "Win32_Media_Audio", "Win32_System_Registry", "Win32_System_Power", "Win32_System_SystemInformation", "Win32_Storage_FileSystem", "Win32_NetworkManagement_IpHelper", "Win32_NetworkManagement_Ndis", "Win32_System_Performance", "Win32_Devices_DeviceAndDriverInstallation", "Win32_Devices_Properties", "Win32_NetworkManagement_WiFi", "Win32_Security", "Win32_Media_Audio_Endpoints", "Win32_System_Com_StructuredStorage", "Win32_System_Variant", "Win32_Globalization", "Win32_Networking_WinSock", "Devices_Geolocation", "Web_Http", "Win32_Networking_WinHttp"] }
windows-core = "0.62"
windows-numerics = "0.3"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
